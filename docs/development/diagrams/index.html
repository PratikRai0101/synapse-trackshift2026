<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GRID//OPS — chronological architecture diagrams</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0d1117; color: #e6edf3;
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  header { padding: 28px 32px 8px; border-bottom: 1px solid #21262d; }
  h1 { margin: 0 0 6px; font-size: 22px; }
  header p { margin: 0; color: #8b949e; max-width: 900px; }
  main { padding: 8px 32px 64px; }
  section { margin: 34px 0 50px; }
  h2 { font-size: 17px; margin: 0 0 4px; color: #7fd1ff; }
  .note { color: #8b949e; margin: 0 0 14px; font-size: 13.5px; }
  .frame { background: #161b22; border: 1px solid #21262d; border-radius: 10px;
           padding: 10px; overflow: auto; }
  .frame img { display: block; max-width: 100%; height: auto; }
  a { color: #8ff0a4; }
  code { background: #161b22; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<header>
  <h1>GRID//OPS — chronological architecture (block diagrams)</h1>
  <p>Rendered from <code>docs/development/13-chronological-architecture-block-diagram.md</code>.
     Dark theme, 2× export. SVG is scalable; PNG is provided for slides.</p>
</header>
<main id="gallery"></main>
<script>
const diagrams = [
  ["01-master-chronology", "1 · Master chronology", "Phase order: authorization → startup → closed-loop episode → scoring → batch → presentation."],
  ["02-authorization-startup", "2 · Phase 0–1: authorization and startup", "What must be frozen before the first action; unknowns disable affected modes."],
  ["03-decision-tick", "3 · Phase 2: one closed-loop decision tick", "The eleven-step cycle, with the physical loop closing back to the plant."],
  ["04-runtime-sequence", "4 · Runtime sequence", "Who calls whom, and when each observation becomes usable."],
  ["05-four-horizon-cascade", "5 · Four-horizon cascade H4→H1", "Downward resource targets; upward feasibility feedback."],
  ["06-information-separation", "6 · Information separation / trust boundary", "Truth has no return path into the controller during action selection."],
  ["07-event-memory", "7 · Event and memory chronology", "What resets, what persists, what widens, across three independent memories."],
  ["08-decision-outcomes", "8 · Decision outcomes and fallback", "Commitment rule: RECOMMEND / RETAIN_REFERENCE / FALLBACK / UNAVAILABLE."],
  ["09-termination-scoring", "9 · Phase 3: termination and scoring", "The evaluator is the only component that sees truth; failures are kept."],
  ["10-experiment-batch", "10 · Phase 4: experiment batch chronology", "Frozen, paired comparison across baselines with an ablation matrix."],
  ["11-records-interface", "11 · Phase 5: records to engineer interface", "Presentation is a projection of immutable records, never a recomputation."],
  ["12-build-chronology", "12 · Build chronology T+0→T+24", "Parallel lanes and the G0–G5 integration gates."],
  ["13-module-map", "13 · Module block map", "Ownership boundaries mapped to the current engine foundation status."],
  ["14-claim-gates", "14 · Claim release gates", "Each sentence is unlocked only by its required evidence."],
];
const main = document.getElementById('gallery');
for (const [name, title, note] of diagrams) {
  const s = document.createElement('section');
  s.innerHTML = `<h2>${title}</h2><p class="note">${note}</p>
    <div class="frame"><img loading="lazy" src="${name}.svg" alt="${title}" /></div>
    <p class="note">Files: <a href="${name}.svg">${name}.svg</a> · <a href="${name}.png">${name}.png</a></p>`;
  main.appendChild(s);
}
</script>
</body>
</html>
